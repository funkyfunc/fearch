[project]
name = "websearch-mcp"
version = "0.1.0"
description = "Zero-API-key web search and page-reading MCP server for coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=3.0",
    "ddgs>=9.16",
    "curl_cffi>=0.13",
    "markdownify>=1.1",
    "trafilatura>=2.0",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    "rank-bm25>=0.2.2",
    "pypdf>=5.0",
    "httpx>=0.27",
]

[project.scripts]
websearch-mcp = "websearch_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/websearch_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
